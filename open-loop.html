<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positronic Soul | Open Loop Failure</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --panel: #0f0f0f;
            --accent: #8b5cf6; /* Positronic Purple */
            --target: #2563eb; /* Neon Blue */
            --danger: #ef4444; /* Red for Wind */
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .header h1 { font-size: 1.5rem; color: var(--accent); }
        .header p { color: #888; font-size: 0.9rem; line-height: 1.5; }

        .lab-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* The canvas will be injected here by p5 */
        #canvas-container {
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 15px;
            background: #151515;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .slider-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent);
        }

        button {
            background: #222;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Log 01: The Illusion of Control</h1>
        <p>Use the manual thrust slider to keep the drone on the blue target line. Find the exact thrust percentage that cancels gravity. Once you feel stable, simulate a real-world disturbance.</p>
    </div>

    <div class="lab-container">
        <div id="canvas-container"></div>
        
        <div class="control-panel">
            <div class="slider-container">
                <label>Manual Thrust: <span id="thrust-display">0</span>%</label>
                <input type="range" id="thrust-slider" min="0" max="100" value="0">
            </div>
            <button id="wind-btn">⚠ SIMULATE WIND</button>
        </div>
    </div>

<script>
// --- PHYSICS VARIABLES ---
let droneY = 350;        // Starting height
let velocity = 0;
let gravity = 0.2;       // Constant downward force
let mass = 1.0;
let damping = 0.96;      // Air resistance
let targetY = 150;       // The Blue Line

// --- SYSTEM VARIABLES ---
let thrustVal = 0;       // Mapped from slider
let windForce = 0;
let windTimer = 0;
let historyData = [];    // For the chart
let maxHistory = 550;    // Width of the chart

// --- HTML ELEMENTS ---
let slider, thrustDisplay, windBtn;

function setup() {
    let canvas = createCanvas(800, 400);
    canvas.parent('canvas-container');
    
    // Hook into HTML elements
    slider = document.getElementById('thrust-slider');
    thrustDisplay = document.getElementById('thrust-display');
    windBtn = document.getElementById('wind-btn');
    
    // Wind button logic
    windBtn.addEventListener('mousedown', () => {
        windForce = 0.4;  // Downward force
        windTimer = 30;   // Lasts for 30 frames
    });
}

function draw() {
    background('#050505');

    // 1. Read User Input
    let rawSlider = parseFloat(slider.value);
    thrustDisplay.innerText = rawSlider;
    // Map slider 0-100 to thrust 0-0.4 (Equilibrium is exactly 50%)
    thrustVal = map(rawSlider, 0, 100, 0, 0.4);

    // 2. Apply Wind Logic
    if (windTimer > 0) {
        windTimer--;
    } else {
        windForce = 0;
    }

    // 3. Physics Engine
    let netForce = gravity + windForce - thrustVal;
    let acceleration = netForce / mass;
    
    velocity += acceleration;
    velocity *= damping; // Friction prevents it from going infinite
    droneY += velocity;

    // Floor and Ceiling collisions
    if (droneY > height - 20) {
        droneY = height - 20;
        velocity = 0;
    }
    if (droneY < 20) {
        droneY = 20;
        velocity = 0;
    }

    // 4. Record Data for Chart
    historyData.push({ y: droneY, thrust: rawSlider });
    if (historyData.length > maxHistory) {
        historyData.shift(); // Remove oldest data point
    }

    // --- RENDER SCENE ---
    drawSimulationArea();
    drawChartArea();
}

function drawSimulationArea() {
    let simWidth = 200;
    
    // Draw containment walls
    stroke(50);
    strokeWeight(1);
    line(simWidth, 0, simWidth, height);

    // Wind visual warning
    if (windTimer > 0) {
        noStroke();
        fill(239, 68, 68, 30); // Faint red overlay
        rect(0, 0, simWidth, height);
    }

    // Draw Target Line (Neon Blue)
    stroke('#2563eb');
    strokeWeight(2);
    drawingContext.shadowBlur = 15;
    drawingContext.shadowColor = '#2563eb';
    line(20, targetY, simWidth - 20, targetY);

    // Draw Drone (Neon Purple)
    noStroke();
    fill('#8b5cf6');
    drawingContext.shadowBlur = 20;
    drawingContext.shadowColor = '#8b5cf6';
    ellipse(simWidth / 2, droneY, 30, 30);
    
    // Reset shadow for text
    drawingContext.shadowBlur = 0;
}

function drawChartArea() {
    let chartX = 220; // Start chart after the simulation area
    
    // Draw Target Line on Chart
    stroke('#2563eb');
    strokeWeight(1);
    drawingContext.setLineDash([5, 5]); // Dashed line
    line(chartX, targetY, width, targetY);
    drawingContext.setLineDash([]); // Reset dash
    
    noFill();
    
    // Draw Actual Position (Purple)
    stroke('#8b5cf6');
    strokeWeight(2);
    beginShape();
    for (let i = 0; i < historyData.length; i++) {
        let x = chartX + i;
        let y = historyData[i].y;
        vertex(x, y);
    }
    endShape();

    // Draw User Input / Thrust (Faint Grey at the bottom)
    stroke(255, 255, 255, 40);
    strokeWeight(1);
    beginShape();
    for (let i = 0; i < historyData.length; i++) {
        let x = chartX + i;
        // Map 0-100 to the bottom 100 pixels of the canvas
        let y = map(historyData[i].thrust, 0, 100, height - 10, height - 110);
        vertex(x, y);
    }
    endShape();
    
    // Labels
    noStroke();
    fill(150);
    textSize(10);
    text("TIME ➔", width - 50, height - 15);
    text("Actual Position", chartX + 10, 20);
    text("User Input", chartX + 10, height - 115);
}
</script>
</body>
</html>
