<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style> body { background: #050505; color: white; display: flex; justify-content: center; } </style>
</head>
<body>
<script>
let droneY = 300;
let velocity = 0;
let target = 200;
let Kp = 0.5; // Proportional Gain

function setup() {
  createCanvas(400, 600);
}

function draw() {
  background(10); // Dark background
  
  // 1. Physics (Gravity)
  velocity += 0.5; // Gravity
  
  // 2. The Control Loop (P-Controller)
  let error = target - droneY; // Distance to target
  let thrust = error * Kp;     // Calculate thrust
  
  // 3. Apply Thrust (Limit it to be realistic)
  thrust = constrain(thrust, 0, 20); 
  velocity -= thrust;
  
  // 4. Update Position
  droneY += velocity;
  velocity *= 0.95; // Air resistance (Damping)

  // --- VISUALS ---
  
  // Draw Target Line (Neon Blue)
  stroke(37, 99, 235); 
  drawingContext.shadowBlur = 20;
  drawingContext.shadowColor = 'blue';
  line(0, target, width, target);
  
  // Draw Drone (Neon Purple)
  noStroke();
  fill(139, 92, 246);
  drawingContext.shadowColor = '#8b5cf6';
  ellipse(width/2, droneY, 40, 40);
  
  // Text Debug
  fill(255);
  noShadow();
  text("Error: " + error.toFixed(1), 20, 30);
  text("Thrust: " + thrust.toFixed(1), 20, 50);
}

function noShadow() {
    drawingContext.shadowBlur = 0;
}
</script>
</body>
</html>
