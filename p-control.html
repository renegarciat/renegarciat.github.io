<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positronic Soul | Proportional Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --panel: #0f0f0f;
            --accent: #8b5cf6; 
            --target: #2563eb; 
            --danger: #ef4444; 
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .header { text-align: center; margin-bottom: 20px; max-width: 800px; }
        .header h1 { font-size: 1.5rem; color: var(--accent); }
        .header p { color: #888; font-size: 0.9rem; line-height: 1.5; }

        .lab-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #canvas-container { border: 1px solid #333; border-radius: 8px; overflow: hidden; }

        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 15px;
            background: #151515;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .slider-container { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: #333; height: 6px; border-radius: 3px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent);
        }

        button {
            background: #222; color: var(--danger); border: 1px solid var(--danger); padding: 10px 20px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: var(--danger); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        button:active { transform: scale(0.95); }
        
        .math-readout {
            font-size: 0.85rem;
            color: #aaa;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        .math-val { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Log 02: Proportional Gain (Kp)</h1>
        <p>The drone is now calculating its own thrust based on the distance to the target. Adjust the Kp dial to make it more or less sensitive. Notice what happens when you try to get it perfectly on the blue line.</p>
    </div>

    <div class="lab-container">
        <div id="canvas-container"></div>
        
        <div class="control-panel">
            <div class="slider-container">
                <label>Sensitivity (Kp): <span id="kp-display">0.05</span></label>
                <input type="range" id="kp-slider" min="0" max="0.2" step="0.001" value="0.05">
            </div>
            
            <div class="math-readout">
                Error: <span id="err-val" class="math-val">0</span>px<br>
                Thrust: <span id="thrust-val" class="math-val">0</span>
            </div>

            <button id="wind-btn">⚠ SIMULATE WIND</button>
        </div>
    </div>

<script>
// --- PHYSICS VARIABLES ---
let droneY = 350;        
let velocity = 0;
let gravity = 0.2;       
let mass = 1.0;
let damping = 0.94; // slightly less damping to show oscillations
let targetY = 150;       

// --- SYSTEM VARIABLES ---
let thrustVal = 0;       
let windForce = 0;
let windTimer = 0;
let historyData = [];    
let maxHistory = 550;    

// --- HTML ELEMENTS ---
let sliderKp, kpDisplay, windBtn, errVal, thrustValDisplay;

function setup() {
    let canvas = createCanvas(800, 400);
    canvas.parent('canvas-container');
    
    sliderKp = document.getElementById('kp-slider');
    kpDisplay = document.getElementById('kp-display');
    windBtn = document.getElementById('wind-btn');
    errVal = document.getElementById('err-val');
    thrustValDisplay = document.getElementById('thrust-val');
    
    windBtn.addEventListener('mousedown', () => {
        windForce = 0.6;  
        windTimer = 20;   
    });
}

function draw() {
    background('#050505');

    // 1. Read Kp Input
    let Kp = parseFloat(sliderKp.value);
    kpDisplay.innerText = Kp.toFixed(3);

    // 2. THE CONTROLLER (P-Logic)
    // Canvas Y goes down, so if droneY > targetY, error is positive (we are below target)
    let error = droneY - targetY; 
    
    // Only apply thrust if we are below the target (drone can't thrust downwards)
    if (error > 0) {
        thrustVal = Kp * error;
    } else {
        thrustVal = 0; // Free fall if overshoot
    }

    // Limit max physical thrust
    thrustVal = constrain(thrustVal, 0, 1.5);

    // Update HTML readouts
    errVal.innerText = error.toFixed(1);
    thrustValDisplay.innerText = thrustVal.toFixed(3);

    // 3. Apply Wind Logic
    if (windTimer > 0) { windTimer--; } else { windForce = 0; }

    // 4. Physics Engine
    let netForce = gravity + windForce - thrustVal;
    let acceleration = netForce / mass;
    
    velocity += acceleration;
    velocity *= damping; 
    droneY += velocity;

    // Floor and Ceiling limits
    if (droneY > height - 20) { droneY = height - 20; velocity = 0; }
    if (droneY < 20) { droneY = 20; velocity = 0; }

    // 5. Record Data
    historyData.push(droneY);
    if (historyData.length > maxHistory) historyData.shift(); 

    drawSimulationArea();
    drawChartArea();
}

function drawSimulationArea() {
    let simWidth = 200;
    
    stroke(50); strokeWeight(1);
    line(simWidth, 0, simWidth, height);

    if (windTimer > 0) {
        noStroke(); fill(239, 68, 68, 30); rect(0, 0, simWidth, height);
    }

    // Draw Target Line 
    stroke('#2563eb'); strokeWeight(2);
    drawingContext.shadowBlur = 15; drawingContext.shadowColor = '#2563eb';
    line(20, targetY, simWidth - 20, targetY);

    // Draw Drone 
    noStroke(); fill('#8b5cf6');
    drawingContext.shadowBlur = 20; drawingContext.shadowColor = '#8b5cf6';
    ellipse(simWidth / 2, droneY, 30, 30);
    
    drawingContext.shadowBlur = 0;
}

function drawChartArea() {
    let chartX = 220; 
    
    // Target Line on Chart
    stroke('#2563eb'); strokeWeight(1);
    drawingContext.setLineDash([5, 5]); 
    line(chartX, targetY, width, targetY);
    drawingContext.setLineDash([]); 
    
    noFill();
    
    // Actual Position Line
    stroke('#8b5cf6'); strokeWeight(2);
    beginShape();
    for (let i = 0; i < historyData.length; i++) {
        let x = chartX + i;
        let y = historyData[i];
        vertex(x, y);
    }
    endShape();

    noStroke(); fill(150); textSize(10);
    text("TIME ➔", width - 50, height - 15);
    text("Actual Position", chartX + 10, 20);
}
</script>
</body>
</html>
